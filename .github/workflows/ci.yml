name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build publishable core
        run: pnpm build:core
      - name: Type check
        run: pnpm check
      - name: Core tests
        run: pnpm test:core
      - name: Inspect npm package contents
        run: pnpm check:package
      - name: Release size gate
        run: pnpm size:gate
      - name: Site build
        run: pnpm --filter @gpu-doodle/site build
      # Training checks need uv, PyTorch and the featurized data; the browser
      # parity test and the site smoke test need Chrome with WebGPU. Both run
      # locally: `pnpm test:training`, `pnpm test:browser`, `pnpm site:smoke`.
